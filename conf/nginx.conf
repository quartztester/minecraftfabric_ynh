location __PATH__/ {
    # The dashboard is the Voxeldash MOD's web server, inside the game
    # process. On a fresh install (mod not present yet) or while the
    # server is booting, nothing listens — fall back to a static
    # explanation instead of a bare 502. (Named fallback hardcodes the
    # app id on purpose: template tags must not abut literal underscores.)
    error_page 502 504 = @minecraft_dashboard_down;

    proxy_pass http://127.0.0.1:__PORT_DASH__/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Live status/maps use websockets and long-poll
    proxy_read_timeout 3600s;
    proxy_buffering off;
}

location @minecraft_dashboard_down {
    default_type text/html;
    return 200 '<html><body style="font-family:sans-serif;max-width:40em;margin:4em auto"><h2>Voxeldash dashboard not active</h2><p>This page proxies the <b>Voxeldash</b> mod embedded in the Minecraft server. Either the mod is not installed yet, or the server is still starting.</p><p>To enable it: drop <code>voxeldash.jar</code> into the <code>mods/</code> directory in the app data dir and restart the service. The game server itself is reachable on port __PORT__ regardless.</p></body></html>';
}
