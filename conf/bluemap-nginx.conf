# Rendered into /etc/nginx/conf.d/__BLUEMAP_DOMAIN__/__APP__.conf
# BlueMap's embedded web server is loopback-bound; expose it publicly on
# its own domain. Players viewing the map have no YunoHost account, so
# this location opts out of the SSO gate (empty location-level
# access_by_lua_block overrides the server-level ssowat hook).
location / {
    access_by_lua_block { }

    # BlueMap is a MOD; when absent or still booting nothing listens —
    # explain instead of a bare 502. (Fallback name hardcodes the app id
    # so template tags never abut literal underscores.)
    error_page 502 504 = @minecraft_bluemap_down;

    proxy_pass http://127.0.0.1:__PORT_WEB__/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_buffering off;
}

location @minecraft_bluemap_down {
    default_type text/html;
    return 200 '<html><body style="font-family:sans-serif;max-width:40em;margin:4em auto"><h2>BlueMap web map not active</h2><p>This page proxies the <b>BlueMap</b> mod embedded in the Minecraft server. Either the mod is not installed yet, or the server is still starting.</p><p>To enable it: drop <code>bluemap.jar</code> into the <code>mods/</code> directory in the app data dir and restart the service.</p></body></html>';
}
